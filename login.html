<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>로그인 · SCM Sample</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<button class="btn btn-sm btn-ghost theme-fab" data-theme-toggle type="button"></button>
<div class="auth">
  <aside class="auth-hero"><div class="logo"><b>S</b> SCM</div><div><h2>데이터를 연결하고,<br>업무를 더 스마트하게.</h2><p>외부 업체 BP·상품 등록을 하나의 워크스페이스에서 관리하세요.</p></div><small>© 2026 SCM Sample</small></aside>
  <main class="auth-main">
    <section class="auth-card">
      <h1>다시 오신 걸 환영해요 👋</h1>
      <p class="sub">업체 계정으로 로그인하세요.</p>
      <div class="alert info" id="joined" hidden>가입 신청이 접수되었습니다. 관리자 승인 후 SMS로 안내드립니다.</div>
      <div class="alert err" id="loginErr" hidden></div>
      <form id="loginForm" novalidate>
        <div class="field"><input name="loginId" placeholder=" " autocomplete="username" autocapitalize="none"><label>아이디</label><span class="msg"></span></div>
        <div class="field"><input name="password" type="password" placeholder=" " autocomplete="current-password"><label>비밀번호</label><button type="button" class="eye" aria-label="비밀번호 표시">👁️</button><span class="msg"></span></div>
        <div class="between" style="margin-bottom:18px"><label class="check" style="margin:0"><input type="checkbox" name="saveId"> 아이디 저장</label><a href="reset.html">비밀번호 재설정</a></div>
        <button class="btn btn-primary btn-block" type="submit">로그인</button>
        <div class="row" style="margin-top:8px"><button class="btn btn-ghost" type="button" data-fill="demo">업체 데모</button><button class="btn btn-ghost" type="button" data-fill="admin">관리자 데모</button></div>
      </form>
      <p class="foot">아직 계정이 없나요? <a href="signup.html">업체 회원가입</a></p>
    </section>
  </main>
</div>
<script src="js/common.js"></script><script src="js/auth.js"></script>
</body></html>
