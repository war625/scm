<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가입 승인 · SCM Sample</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar"></header>
<main class="container">
  <div class="page-head"><div><h1>가입 승인 관리</h1><p>업체 가입 신청을 검토하고 승인/반려 처리합니다. 처리 시 SMS가 발송됩니다(데모).</p></div>
    <button class="btn btn-primary" id="bulkApprove" type="button" disabled>선택 승인</button></div>

  <div class="stats" id="stats"></div>

  <div class="toolbar">
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="업체명·사업자번호·아이디 검색" aria-label="검색"></div>
  </div>
  <div class="chips" id="chips" style="margin-bottom:16px">
    <button class="chip on" data-st="all">전체</button><button class="chip" data-st="pending">승인대기</button><button class="chip" data-st="approved">승인완료</button><button class="chip" data-st="rejected">반려</button><button class="chip" data-st="log">발송이력</button>
  </div>

  <div class="table-wrap" id="tblWrap">
    <table class="tbl"><thead><tr><th style="width:36px"><input type="checkbox" id="chkAll" aria-label="전체 선택"></th><th>업체명</th><th>사업자번호</th><th>대표자</th><th>담당자</th><th>신청일</th><th>상태</th></tr></thead><tbody id="rows"></tbody></table>
  </div>
  <div class="table-wrap" id="logWrap" hidden>
    <table class="tbl"><thead><tr><th>시각</th><th>채널</th><th>수신</th><th>내용</th></tr></thead><tbody id="logRows"></tbody></table>
  </div>
</main>

<div class="overlay" id="detail"><article class="modal" role="dialog" aria-modal="true">
  <div class="modal-head"><div><h2 id="dName"></h2><span class="st" id="dSt"></span></div><button class="btn btn-sm btn-ghost" data-close type="button" aria-label="닫기">✕</button></div>
  <div class="alert err" id="dReason" hidden></div>
  <dl class="dl" id="dInfo"></dl>
  <b>제출 서류</b>
  <div class="docs" id="dDocs"></div>
  <div id="dActions">
    <div class="field"><textarea id="rejectReason" placeholder=" " style="min-height:84px"></textarea><label>반려 사유 (반려 시 필수)</label><span class="msg"></span></div>
    <div class="reasons" id="reasons"><button type="button" class="chip">서류 식별 불가</button><button type="button" class="chip">사업자 정보 불일치</button><button type="button" class="chip">휴·폐업 사업자</button><button type="button" class="chip">필수 서류 누락</button></div>
    <div class="actions"><button class="btn" id="rejectBtn" type="button" style="color:var(--danger)">반려</button><button class="btn btn-primary" id="approveBtn" type="button">승인</button></div>
  </div>
</article></div>
<script src="js/common.js"></script><script src="js/admin.js"></script>
</body></html>
