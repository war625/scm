<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게시판 · SCM Sample</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="topbar"></header>
<main class="container">
  <div class="page-head"><div><h1>게시판</h1><p>팀의 소식과 질문을 공유하세요. <span id="count"></span></p></div><button class="btn btn-primary" id="writeBtn" type="button">✏️ 글쓰기</button></div>
  <div class="toolbar">
    <div class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="제목·내용 검색" aria-label="검색"></div>
    <select class="select" id="sort" aria-label="정렬"><option value="new">최신순</option><option value="views">조회순</option><option value="likes">좋아요순</option></select>
  </div>
  <div class="chips" id="chips" style="margin-bottom:18px"><button class="chip on" data-cat="all">전체</button><button class="chip" data-cat="notice">공지</button><button class="chip" data-cat="free">자유</button><button class="chip" data-cat="qna">Q&amp;A</button></div>
  <ul class="post-list" id="postList"></ul>
  <div class="pager" id="pager"></div>
</main>

<div class="overlay" id="viewModal"><article class="modal" role="dialog" aria-modal="true">
  <div class="modal-head"><div><h2 id="vTitle"></h2><small id="vMeta" style="color:var(--muted)"></small></div><button class="btn btn-sm btn-ghost" data-close type="button" aria-label="닫기">✕</button></div>
  <div class="modal-body" id="vBody"></div>
  <div id="vActions" class="actions" hidden><button class="btn btn-sm" id="editBtn" type="button">수정</button><button class="btn btn-sm" id="delBtn" type="button" style="color:var(--danger)">삭제</button></div>
  <div class="comments"><b>댓글</b><div id="cList"></div>
    <form class="comment-form" id="cForm"><input id="cInput" placeholder="댓글을 입력하세요" aria-label="댓글"><button class="btn btn-primary btn-sm" type="submit">등록</button></form></div>
</article></div>

<div class="overlay" id="writeModal"><form class="modal" id="writeForm" role="dialog" aria-modal="true" novalidate>
  <div class="modal-head"><h2 id="wHead">새 글 작성</h2><button class="btn btn-sm btn-ghost" data-close type="button" aria-label="닫기">✕</button></div>
  <div class="field"><select name="category"><option value="free">자유</option><option value="qna">Q&amp;A</option><option value="notice">공지</option></select><label>분류</label></div>
  <div class="field"><input name="title" placeholder=" " maxlength="80"><label>제목</label><span class="msg"></span></div>
  <div class="field"><textarea name="content" placeholder=" " maxlength="2000"></textarea><label>내용</label><span class="msg"></span></div>
  <div class="between"><small id="wCount" style="color:var(--muted)">0 / 2000</small><div class="actions" style="margin:0"><button class="btn" data-close type="button">취소</button><button class="btn btn-primary" type="submit">저장</button></div></div>
</form></div>
<script src="js/common.js"></script><script src="js/board.js"></script>
</body></html>
